name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    # WPF only builds/runs on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - run: dotnet restore FieldJobs.sln
      - run: dotnet build FieldJobs.sln -c Release --no-restore
      - run: dotnet test FieldJobs.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-results.trx"

  installer:
    needs: build-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # windows-latest runners ship Inno Setup preinstalled; build.ps1 also
      # supports installing it via winget if that ever stops being true.
      - name: Build app + installer
        shell: pwsh
        run: ./build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: fieldjobs-installer
          path: dist/*.exe
